<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ontario Draft Watch</title>
<style>
 :root{--bg:#0f1419;--card:#18202a;--fg:#e8edf2;--mut:#8b98a5;--acc:#4aa3ff;--line:#263140}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
 header{padding:18px 16px 8px}h1{margin:0;font-size:20px}.sub{color:var(--mut);font-size:13px;margin-top:2px}
 .controls{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px}
 select,input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
 input[type=search]{flex:1;min-width:140px}
 label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
 ol{list-style:none;margin:0;padding:8px 16px 40px;max-width:760px}
 li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
 .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(74,163,255,.12);z-index:0}
 .row{position:relative;z-index:1;display:flex;gap:12px;align-items:center}
 .rk{font-size:20px;font-weight:700;width:34px;text-align:center;color:var(--acc)}
 .main{flex:1;min-width:0}.nm{font-weight:600}.nm a{color:inherit;text-decoration:none}.nm a:hover{color:var(--acc)}
 .meta{color:var(--mut);font-size:13px}.v{text-align:right}.v b{font-size:17px}.v span{display:block;color:var(--mut);font-size:12px}
 #status{padding:8px 16px;color:var(--mut)}.err{color:#ff7b72}
</style></head><body>
<header><h1>Ontario Draft Watch</h1>
<div class="sub" id="sub">Ontario-born NHL Draft-eligible prospects, ranked by Elite Prospects profile views</div></header>
<div class="controls">
 <select id="year"><option>2027</option><option>2028</option><option>2026</option></select>
 <input id="q" type="search" placeholder="Search name, team, league">
 <select id="pos"><option value="">All pos</option><option>F</option><option>D</option><option>G</option></select>
 <label><input id="unk" type="checkbox"> include unknown birthplace</label>
</div>
<div id="status">Loading…</div><ol id="list"></ol>
<script>
let players=[];const $=id=>document.getElementById(id);
async function load(){
 $('status').className='';$('status').textContent='Loading… (first load pages through the EP API)';$('list').innerHTML='';
 try{
  const r=await fetch(`https://owccuddpjvtetbnvgqrs.supabase.co/functions/v1/ontario-prospects?year=${$('year').value}&includeUnknown=${$('unk').checked?1:0}`,{headers:{Authorization:'Bearer sb_publishable_RYfPFixRzWTgqpudMa_oBA_eapVSrAN',apikey:'sb_publishable_RYfPFixRzWTgqpudMa_oBA_eapVSrAN'}});
  const j=await r.json();if(!r.ok)throw new Error(j.error);
  players=j.players;$('sub').textContent=`${j.players.length} Ontario-born prospects from ${j.scanned} Canadian-national draft-eligibles · EP data as of ${new Date(j.fetchedAt).toLocaleTimeString()}`;
  render();
 }catch(e){$('status').className='err';$('status').textContent=e.message}
}
function render(){
 const q=$('q').value.toLowerCase(),pos=$('pos').value;
 const rows=players.filter(p=>(!pos||p.position===pos)&&(!q||[p.name,p.team,p.league].join(' ').toLowerCase().includes(q)));
 const max=Math.max(1,...rows.map(p=>p.views));
 $('status').textContent=rows.length?'':'No matches.';
 $('list').innerHTML=rows.map(p=>`<li><div class="bar" style="width:${p.views/max*100}%"></div><div class="row">
  <div class="rk">${p.rank}</div><div class="main"><div class="nm"><a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)}</a></div>
  <div class="meta">${[p.position,esc(p.team||''),esc(p.league||''),p.gp!=null?`${p.gp} GP, ${p.pts} P`:'',esc(p.birthplace||'birthplace unknown')].filter(Boolean).join(' · ')}</div></div>
  <div class="v"><b>${p.views.toLocaleString()}</b><span>views</span></div></div></li>`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
['year','unk'].forEach(i=>$(i).onchange=load);['q','pos'].forEach(i=>$(i).oninput=render);
load();
</script></body></html>
